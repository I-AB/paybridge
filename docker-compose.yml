# Local PostgreSQL for trying PayBridge with persistent data.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: paybridge
      POSTGRES_USER: paybridge
      POSTGRES_PASSWORD: paybridge
    ports:
      - "5432:5432"
    volumes:
      - paybridge-data:/var/lib/postgresql/data
volumes:
  paybridge-data:
